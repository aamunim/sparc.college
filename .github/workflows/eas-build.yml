# নেটিভ বিল্ড (APK/AAB) — হাতে চালানো যায়, বা v* tag দিলে production।
# ডিফল্ট: GitHub runner-এ `eas build --local` — Expo-র ফ্রি কোটা খরচ হয় না, সাইনিং key একই (Expo-তে রাখা)।
# APK হলে GitHub Releases-এ pre-release হিসেবে দেওয়া হয় (ফোন থেকে সরাসরি নামানো যায়)।
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      local:
        description: Build on the GitHub runner (saves EAS cloud quota)
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN নেই — বিল্ড বাদ (README-এর সেটআপ দেখুন)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        if: steps.secrets.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.secrets.outputs.ok == 'true' && inputs.local == true
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        if: steps.secrets.outputs.ok == 'true'
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Cloud build
        if: steps.secrets.outputs.ok == 'true' && inputs.local != true
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
      - name: Local build on runner
        if: steps.secrets.outputs.ok == 'true' && inputs.local == true
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: |
          EXT=$([ "$PROFILE" = production ] && echo aab || echo apk)
          eas build --platform android --profile "$PROFILE" --non-interactive --local --output "sparc-$PROFILE-${{ github.run_number }}.$EXT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secrets.outputs.ok == 'true' && inputs.local == true
        with:
          name: sparc-android-${{ inputs.profile }}
          path: apps/mobile/sparc-${{ inputs.profile }}-${{ github.run_number }}.*
      - name: Publish APK as pre-release
        if: steps.secrets.outputs.ok == 'true' && inputs.local == true && inputs.profile != 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="sparc-$PROFILE-${{ github.run_number }}.apk"
          # Android OTP অটোরিডের hash (SMS Retriever): প্যাকেজ + সাইনিং সার্টিফিকেট থেকে
          HASH="(বের করা যায়নি — অ্যাপের নিচের সংস্করণ-লেখায় চাপ দিলে দেখা যাবে)"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if "$BT/apksigner" verify --print-certs-pem "$APK" > cert.pem 2>/dev/null && grep -q "BEGIN CERTIFICATE" cert.pem; then
            PKG=$(jq -r '.expo.android.package' app.json)
            HEX=$(openssl x509 -in cert.pem -outform der | xxd -p | tr -d '\n')
            HASH=$(printf '%s %s' "$PKG" "$HEX" | openssl dgst -sha256 -binary | head -c 9 | base64 | cut -c1-11)
          fi
          echo "SMS app hash: $HASH"
          gh release create "eas-$PROFILE-${{ github.run_number }}" "$APK" \
            --prerelease --target "$GITHUB_SHA" \
            --title "SPARC $PROFILE ${{ github.run_number }} (EAS)" \
            --notes "EAS বিল্ড ($PROFILE চ্যানেল, OTA আপডেট পায়)। commit $GITHUB_SHA।

          OTP অটোরিড hash (Supabase → Edge Functions → Secrets → \`SMS_APP_HASH\`): \`$HASH\`"
