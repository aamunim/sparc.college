# নেটিভ বিল্ড (APK/AAB) — হাতে চালানো যায়, বা v* tag দিলে production।
# নোট: EAS ক্লাউড বিল্ডের ফ্রি কোটা সীমিত; শেষ হলে local প্রোফাইলে `eas build --local` (§১২.৩)।
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      local:
        description: Build on the GitHub runner (saves EAS cloud quota)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN নেই — বিল্ড বাদ (README-এর সেটআপ দেখুন)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        if: steps.secrets.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        if: steps.secrets.outputs.ok == 'true'
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Cloud build
        if: steps.secrets.outputs.ok == 'true' && inputs.local != true
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
      - name: Local build on runner
        if: steps.secrets.outputs.ok == 'true' && inputs.local == true
        run: eas build --platform android --profile "$PROFILE" --non-interactive --local --output sparc-android-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secrets.outputs.ok == 'true' && inputs.local == true
        with:
          name: sparc-android-${{ inputs.profile }}
          path: apps/mobile/sparc-android-build
