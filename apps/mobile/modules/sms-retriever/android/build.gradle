plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'college.sparc'
version = '1.0.0'

android {
  namespace "college.sparc.smsretriever"
}

dependencies {
  // SMS Retriever API — SMS পড়ার অনুমতি লাগে না (Google Play নীতির সাথে সামঞ্জস্যপূর্ণ)
  implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
