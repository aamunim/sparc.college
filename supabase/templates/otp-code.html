<!doctype html>
<html lang="bn">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif;
      color: #0f172a;
    ">
    <table
      role="presentation"
      width="100%"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
      ">
      <tr>
        <td>
          <h1 style="margin: 0 0 8px; font-size: 22px">SPARC</h1>
          <p style="margin: 0 0 16px; font-size: 16px">আপনার লগইন কোড / Your login code:</p>
          <p style="margin: 0 0 16px; font-size: 32px; font-weight: bold; letter-spacing: 8px">
            {{ .Token }}
          </p>
          <p style="margin: 0 0 8px; font-size: 14px; color: #475569">
            কোডটা ৫ মিনিট কাজ করবে। কাউকে বলবেন না — SPARC কখনো কোড চায় না।
          </p>
          <p style="margin: 0; font-size: 14px; color: #475569">
            The code works for 5 minutes. Never share it — SPARC will never ask for it.
          </p>
          <p style="margin: 16px 0 0; font-size: 12px; color: #475569">
            আপনি এটা চাননি? তাহলে ইমেইলটা উপেক্ষা করুন। / Didn't request this? Ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
